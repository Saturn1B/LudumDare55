name: Weekly Database Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'   # every Sunday at 03:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too

jobs:
  cleanup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tools/cleanup
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json

      - name: Run levels cleanup
        run: node cleanup_levels.js

      - name: Run thumbnails cleanup
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node cleanup_thumbnails.js

      - name: Remove service account key
        if: always()
        run: rm -f firebase-service-account.json